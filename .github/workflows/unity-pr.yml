name: Unity PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  unity:
    name: Unity Compile and Tests
    runs-on: ${{ vars.UNITY_CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - name: Check out the PR merge revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compile Unity scripts
        id: compile
        shell: pwsh
        run: ./.github/scripts/Test-Unity.ps1 -Phase Compile

      - name: Run Unity EditMode tests
        shell: pwsh
        run: ./.github/scripts/Test-Unity.ps1 -Phase EditMode

      - name: Run Unity PlayMode tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/Test-Unity.ps1 -Phase PlayMode

      - name: Upload Unity logs and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unity-validation
          path: Logs/UnityCI/
          if-no-files-found: ignore
